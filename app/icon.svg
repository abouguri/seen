<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!--
    The same three-card stack as <SeenMark />, with the opacity ramp
    resolved to solid colours. A favicon composites onto the browser's
    tab strip rather than onto an app surface, so the 55%/78% cards would
    land on an unknown ground; these are that ramp pre-mixed against the
    app's own --bg.

    The dark-mode block is progressive enhancement — Chrome, Firefox and
    Safari honour prefers-color-scheme inside an SVG favicon, and where
    it isn't honoured the first set stands on its own against either
    strip. Geometry is kept in step with SeenMark.tsx by hand: it is
    three rectangles, and a build step to share them would cost more than
    it saves.
  -->
  <style>
    .back  { fill: #362a7a }
    .mid   { fill: #47339f }
    .front { fill: #5436ce }
    @media (prefers-color-scheme: dark) {
      .back  { fill: #4b3aa4 }
      .mid   { fill: #5f45c4 }
      .front { fill: #7a5ff0 }
    }
  </style>
  <rect class="back"  x="0.5"  y="1"    width="11" height="16.5" rx="2"/>
  <rect class="mid"   x="6.5"  y="3.75" width="11" height="16.5" rx="2"/>
  <rect class="front" x="12.5" y="6.5"  width="11" height="16.5" rx="2"/>
</svg>

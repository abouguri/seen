<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    The SEEN mark: three cards fanned into a stack, the front one wearing
    the app's one dot. Geometry is derived directly from the percentages
    in components/shell/SeenMark.tsx. CSS rotate() turns about an
    element's own centre, which is why each rect carries its own
    rotate(angle, cx, cy) at its midpoint rather than a shared origin.

    The fills are the palette's warm, accent-text and accent tokens
    resolved to hex: a favicon composites onto the browser's tab strip
    and cannot read the app's custom properties. Keep them in step with
    globals.css if the palette moves.

    Note for editors: this is XML, so a comment may not contain two
    consecutive hyphens. Write token names as "accent", never with their
    CSS prefix, or the whole file silently stops parsing and the tab
    falls back to a blank icon.
  -->
  <rect x="0"  y="12" width="56" height="72" rx="12.32" fill="#fe9e47"
        transform="rotate(-14, 28, 48)"/>
  <rect x="16" y="8"  width="56" height="76" rx="12.32" fill="#ccb8fb"
        transform="rotate(-6, 44, 46)"/>
  <g transform="rotate(5, 64, 49)">
    <rect x="34" y="10" width="60" height="78" rx="14.4" fill="#5436ce"/>
    <ellipse cx="76.6" cy="27.55" rx="6.6" ry="6.63" fill="#ffffff"/>
  </g>
</svg>
